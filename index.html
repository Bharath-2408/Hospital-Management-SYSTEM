<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Hospital & Patient Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            hospital: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
    /* Smooth Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

  <!-- TOP APP BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-hospital-600 to-teal-500 flex items-center justify-center text-white shadow-md font-black text-xl">
          H+
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-slate-800 text-base sm:text-lg leading-tight">Smart Hospital</h1>
            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">STANDALONE APP</span>
          </div>
          <p class="text-[11px] text-slate-400 font-medium">Healthcare Information & Patient Management</p>
        </div>
      </div>

      <!-- User Role Selector & Action Toolbar -->
      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Quick Role Switcher -->
        <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
          <span class="text-slate-500 pl-2 hidden md:inline text-[11px]">Role:</span>
          <select id="role-selector" onchange="switchRole(this.value)" class="bg-white text-slate-800 font-bold px-2.5 py-1 rounded-lg border border-slate-200 shadow-sm outline-none cursor-pointer">
            <option value="admin">Admin (Full Access)</option>
            <option value="doctor">Doctor (Dr. Smith)</option>
            <option value="receptionist">Receptionist (Desk)</option>
            <option value="accountant">Accountant (Billing)</option>
            <option value="patient">Patient (John Doe)</option>
          </select>
        </div>

        <!-- Notification Bell -->
        <div class="relative">
          <button onclick="toggleNotifications()" class="relative p-2 rounded-xl text-slate-500 hover:bg-slate-100 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span id="notif-badge" class="absolute top-1.5 right-1.5 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center animate-pulse">2</span>
          </button>
          
          <!-- Dropdown -->
          <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-2xl border border-slate-100 py-3 z-50">
            <div class="flex items-center justify-between px-4 pb-2 border-b border-slate-100">
              <span class="font-bold text-xs text-slate-800">System Notifications</span>
              <button onclick="markAllNotificationsRead()" class="text-[11px] text-hospital-600 hover:underline">Mark all read</button>
            </div>
            <div id="notif-list" class="max-h-64 overflow-y-auto divide-y divide-slate-50 text-xs p-1"></div>
          </div>
        </div>

        <!-- Reset Demo Data -->
        <button onclick="resetDemoData()" title="Reset to default healthcare seed data" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition text-xs font-semibold hidden sm:flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="text-[11px]">Reset Data</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP WRAPPER WITH SIDEBAR & CONTENT -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-full md:w-64 bg-white md:border-r border-slate-200 p-4 shrink-0">
      <div class="space-y-1" id="nav-container">
        <!-- Injected via JavaScript based on role -->
      </div>
    </aside>

    <!-- MAIN CONTENT VIEW -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <div id="app-view">
        <!-- Active View rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- MODALS CONTAINER -->
  <div id="modal-container"></div>

  <!-- PRINTABLE AREA CONTAINER (FOR RX & INVOICES) -->
  <div id="printable-area" class="hidden"></div>

  <!-- JAVASCRIPT APPLICATION CORE -->

        { id: 2, payment_id: 'PAY-2026-0002', bill_id: 3, bill_number: 'INV-2026-0003', patient_name: 'Robert Taylor', amount: 100, method: 'UPI / QR', transaction_id: 'UPI-HOSP-771829', date: '2026-09-16' }
      ],
      notifications: [
        { id: 1, title: 'Follow-up Appointment Confirmed', message: 'John Doe scheduled with Dr. Alexander Smith on 2026-09-18 at 11:00 AM.', is_read: false, time: '10 mins ago' },
        { id: 2, title: 'Payment Successfully Processed', message: 'Payment of $100.00 received via UPI for Invoice INV-2026-0003.', is_read: false, time: '1 hour ago' },
        { id: 3, title: 'Prescription Issued', message: 'Prescription RX-2026-0001 issued for patient John Doe.', is_read: true, time: 'Yesterday' }
      ]
    };

    // Initialize or load LocalStorage
    function getStore() {
      const data = localStorage.getItem('smart_hospital_db');
      if (!data) {
        localStorage.setItem('smart_hospital_db', JSON.stringify(DEFAULT_SEED_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
      }
      return JSON.parse(data);
    }

    function saveStore(data) {
      localStorage.setItem('smart_hospital_db', JSON.stringify(data));
    }

    function resetDemoData() {
      if (confirm('Reset hospital database to default demo records?')) {
        localStorage.setItem('smart_hospital_db', JSON.stringify(DEFAULT_SEED_DATA));
        renderActiveView();
        updateNotificationCount();
      }
    }

    // Active state
    let activeTab = 'dashboard';
    let currentRole = getStore().role || 'admin';

    function switchRole(role) {
      currentRole = role;
      const store = getStore();
      store.role = role;
      saveStore(store);
      renderNavigation();
      renderActiveView();
    }

    // --- 2. NAVIGATION RENDERER ---
    function renderNavigation() {
      const container = document.getElementById('nav-container');
      const role = currentRole;
      document.getElementById('role-selector').value = role;

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'patients', label: 'Patients', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
        { id: 'doctors', label: 'Doctors', icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' },
        { id: 'departments', label: 'Departments', icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4' },
        { id: 'appointments', label: 'Appointments', icon: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' },
        { id: 'medical_records', label: 'Medical Records', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
        { id: 'prescriptions', label: 'Prescriptions', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' },
        { id: 'billing', label: 'Billing & Payments', icon: 'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z' },
        { id: 'reports', label: 'Analytics & CSV', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' }
      ];

      container.innerHTML = navItems.map(item => `
        <button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
          activeTab === item.id
            ? 'bg-hospital-600 text-white shadow-md shadow-hospital-600/20'
            : 'text-slate-600 hover:bg-slate-100'
        }">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"/></svg>
          <span>${item.label}</span>
        </button>
      `).join('');
    }

    function navigateTo(tab) {
      activeTab = tab;
      renderNavigation();
      renderActiveView();
    }

    // --- 3. VIEW RENDERERS ---
    function renderActiveView() {
      const container = document.getElementById('app-view');
      const store = getStore();

      switch (activeTab) {
        case 'dashboard':
          renderDashboard(container, store);
          break;
        case 'patients':
          renderPatients(container, store);
          break;
        case 'doctors':
          renderDoctors(container, store);
          break;
        case 'departments':
          renderDepartments(container, store);
          break;
        case 'appointments':
          renderAppointments(container, store);
          break;
        case 'medical_records':
          renderMedicalRecords(container, store);
          break;
        case 'prescriptions':
          renderPrescriptions(container, store);
          break;
        case 'billing':
          renderBilling(container, store);
          break;
        case 'reports':
          renderReports(container, store);
          break;
      }
    }

    // Status Badge Helper
    function getStatusBadge(status) {
      const map = {
        'Active': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Completed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Paid': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Confirmed': 'bg-blue-50 text-blue-700 border-blue-200',
        'Admitted': 'bg-blue-50 text-blue-700 border-blue-200',
        'Pending': 'bg-amber-50 text-amber-700 border-amber-200',
        'Partially Paid': 'bg-amber-50 text-amber-700 border-amber-200',
        'Discharged': 'bg-slate-100 text-slate-700 border-slate-200',
        'Cancelled': 'bg-rose-50 text-rose-700 border-rose-200',
      };
      const cls = map[status] || 'bg-slate-50 text-slate-600 border-slate-200';
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${cls}">${status}</span>`;
    }

    // --- VIEW: DASHBOARD ---
    function renderDashboard(el, store) {
      const totalRevenue = store.payments.reduce((acc, p) => acc + Number(p.amount), 0);
      const pendingRevenue = store.bills.reduce((acc, b) => acc + Number(b.balance_due), 0);

      el.innerHTML = `
        <div class="space-y-6">
          <!-- Banner -->
          <div class="bg-gradient-to-r from-hospital-700 via-hospital-600 to-teal-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl shadow-hospital-900/10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span class="text-[10px] font-extrabold uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">
                  Role: ${currentRole.toUpperCase()}
                </span>
                <h2 class="text-2xl sm:text-3xl font-black mt-2">Smart Hospital Operations Desk</h2>
                <p class="text-hospital-100 text-xs mt-1">Autonomous, zero-setup Full-Stack CRUD Application.</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openAddPatientModal()" class="px-4 py-2 bg-white text-hospital-700 hover:bg-hospital-50 rounded-xl font-bold text-xs shadow-md transition">
                  + Add Patient
                </button>
                <button onclick="openBookAppointmentModal()" class="px-4 py-2 bg-teal-500 hover:bg-teal-400 text-white rounded-xl font-bold text-xs shadow-md transition">
                  + Book Appointment
                </button>
              </div>
            </div>
          </div>

          <!-- KPI Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
              <span class="text-xs font-bold text-slate-400 uppercase">Registered Patients</span>
              <h3 class="text-2xl font-black text-slate-800 mt-1">${store.patients.length}</h3>
              <p class="text-[11px] text-slate-500 mt-1">${store.patients.filter(p=>p.status==='Admitted').length} Admitted Inpatients</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">

    function filterPatientsTable() {
      const store = getStore();
      const q = (document.getElementById('patient-search')?.value || '').toLowerCase();
      const st = document.getElementById('patient-status-filter')?.value || '';

      const filtered = store.patients.filter(p => {
        const matchesQuery = p.full_name.toLowerCase().includes(q) || p.patient_id.toLowerCase().includes(q) || p.phone.includes(q);
        const matchesStatus = !st || p.status === st;
        return matchesQuery && matchesStatus;
      });

      const tbody = document.getElementById('patients-tbody');
      if (!tbody) return;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">No patient records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => `
        <tr class="hover:bg-slate-50/60">
          <td class="py-3.5 px-4 font-mono font-bold text-hospital-600">${p.patient_id}</td>
          <td class="py-3.5 px-4 font-semibold text-slate-800">${p.full_name}</td>
          <td class="py-3.5 px-4 text-slate-600">${p.age} yrs • ${p.gender}</td>
          <td class="py-3.5 px-4 font-bold text-rose-600">${p.blood_group}</td>
          <td class="py-3.5 px-4 text-slate-600 font-medium">${p.phone}</td>
          <td class="py-3.5 px-4">${getStatusBadge(p.status)}</td>
          <td class="py-3.5 px-4 text-right space-x-1 whitespace-nowrap">
            <button onclick="viewPatientDetails(${p.id})" class="px-2 py-1 text-slate-600 hover:text-hospital-600 font-bold hover:bg-hospital-50 rounded-lg">View</button>
            <button onclick="openEditPatientModal(${p.id})" class="px-2 py-1 text-slate-600 hover:text-amber-600 font-bold hover:bg-amber-50 rounded-lg">Edit</button>
            <button onclick="deletePatient(${p.id})" class="px-2 py-1 text-slate-400 hover:text-rose-600 font-bold hover:bg-rose-50 rounded-lg">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // --- 4. CSV DOWNLOAD GENERATOR ---
    function exportCSV(type) {
      const store = getStore();
      let csvContent = '';
      let filename = `${type}_export_${new Date().toISOString().split('T')[0]}.csv`;

      if (type === 'patients') {
        csvContent = "Patient ID,Full Name,Age,Gender,Blood Group,Phone,Email,Status,Registration Date\n" +
          store.patients.map(p => `"${p.patient_id}","${p.full_name}",${p.age},"${p.gender}","${p.blood_group}","${p.phone}","${p.email}","${p.status}","${p.registration_date}"`).join("\n");
      } else if (type === 'appointments') {
        csvContent = "Appointment No,Patient,Doctor,Department,Date,Time,Reason,Status\n" +
          store.appointments.map(a => `"${a.appointment_number}","${a.patient_name}","${a.doctor_name}","${a.department_name}","${a.date}","${a.time}","${a.reason}","${a.status}"`).join("\n");
      } else if (type === 'doctors') {
        csvContent = "Name,Department,Specialization,Qualification,Experience,Fee,Phone\n" +
          store.doctors.map(d => `"${d.full_name}","${d.department_name}","${d.specialization}","${d.qualification}",${d.experience_years},${d.consultation_fee},"${d.phone}"`).join("\n");
      } else if (type === 'billing') {
        csvContent = "Bill No,Patient,Total,Paid,Balance Due,Status,Date\n" +
          store.bills.map(b => `"${b.bill_number}","${b.patient_name}",${b.final_amount},${b.total_paid},${b.balance_due},"${b.payment_status}","${b.date}"`).join("\n");
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function submitAddPatient(e) {
      e.preventDefault();

        full_name: document.getElementById('form-pname').value,
        age: parseInt(document.getElementById('form-page').value),
        gender: document.getElementById('form-pgender').value,
        blood_group: document.getElementById('form-pblood').value,
        status: document.getElementById('form-pstatus').value,
        phone: document.getElementById('form-pphone').value,
        email: 'patient@hospital.org',
        address: document.getElementById('form-paddr').value,
        registration_date: new Date().toISOString().split('T')[0]
      };
      store.patients.unshift(newPatient);
      saveStore(store);
      closeModal();
      renderActiveView();
    }

      if (confirm('Permanently delete this patient record?')) {

    function submitBookAppointment(e) {
      e.preventDefault();
      const store = getStore();
      const pid = parseInt(document.getElementById('form-apt-patient').value);
      const did = parseInt(document.getElementById('form-apt-doctor').value);
      const patient = store.patients.find(p => p.id === pid);
      const doctor = store.doctors.find(d => d.id === did);
      const count = store.appointments.length + 1;

      const newApt = {
        id: Date.now(),
        appointment_number: `APT-2026-${String(count).padStart(4, '0')}`,
        patient_id: pid,
        patient_name: patient ? patient.full_name : 'Patient',
        doctor_id: did,
        doctor_name: doctor ? doctor.full_name : 'Doctor',
        department_name: doctor ? doctor.department_name : 'General',
        date: document.getElementById('form-apt-date').value,
        time: document.getElementById('form-apt-time').value,
        reason: document.getElementById('form-apt-reason').value,
        status: 'Pending',
        notes: ''
      };

      store.appointments.unshift(newApt);
      saveStore(store);
      closeModal();
      renderActiveView();
    }

    function updateAppointmentStatus(id, newStatus) {
      const store = getStore();
      const apt = store.appointments.find(a => a.id === id);
      if (apt) {
        apt.status = newStatus;
        saveStore(store);
        renderActiveView();
      }
    }

    function deleteAppointment(id) {

        const store = getStore();
        store.appointments = store.appointments.filter(a => a.id !== id);
        saveStore(store);
        renderActiveView();
      }
    }

    // --- NOTIFICATIONS ---
    function toggleNotifications() {
      const d = document.getElementById('notif-dropdown');
      d.classList.toggle('hidden');
      renderNotifications();
    }

    function renderNotifications() {
      const store = getStore();
      const list = document.getElementById('notif-list');
      list.innerHTML = store.notifications.map(n => `
        <div class="p-2.5 hover:bg-slate-50 transition rounded-xl ${!n.is_read ? 'bg-hospital-50/50' : ''}">
          <p class="font-bold text-slate-800 text-xs">${n.title}</p>
          <p class="text-[11px] text-slate-600 mt-0.5">${n.message}</p>
          <span class="text-[9px] text-slate-400 mt-1 block">${n.time}</span>
        </div>
      `).join('');
    }

    function updateNotificationCount() {
      const store = getStore();
      const unread = store.notifications.filter(n => !n.is_read).length;
      const b = document.getElementById('notif-badge');
      if (unread > 0) {
        b.innerText = unread;
        b.classList.remove('hidden');
      } else {
        b.classList.add('hidden');
      }
    }

    function markAllNotificationsRead() {
      const store = getStore();
      store.notifications.forEach(n => n.is_read = true);
      saveStore(store);
      updateNotificationCount();
      renderNotifications();
    }

    // Initialize on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderNavigation();
      renderActiveView();
      updateNotificationCount();
    });
  </script>
